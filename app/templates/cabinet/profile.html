{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<h1>Профиль</h1>
<div class="cabinet-layout">
  {% include "cabinet/_menu.html" %}
  <div class="card form-card">
    {% if errors %}<div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="full_name">ФИО</label>
      <input type="text" id="full_name" name="full_name" value="{{ request.form.get('full_name', current_user.full_name) }}" required>
      <label for="email">Электронная почта</label>
      <input type="email" id="email" name="email" value="{{ request.form.get('email', current_user.email) }}">
      <p class="muted">Логин и роль изменяет только администратор.</p>
      <p><button class="btn" type="submit">Сохранить</button></p>
    </form>
  </div>
</div>
{% endblock %}
