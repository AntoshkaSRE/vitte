{% extends "base.html" %}
{% block title %}Дашборды{% endblock %}
{% block content %}
<h1>Дашборды</h1>
<p>Доступно панелей для роли «{{ current_user.role_name }}»: <strong>{{ dashboards|length }}</strong>.</p>
<div class="grid grid-3">
  {% for d in dashboards %}
    <article class="card">
      <h3><a href="{{ url_for('dashboards.show', code=d.code) }}">{{ d.title }}</a></h3>
      <p>{{ d.description }}</p>
      <p><span class="badge badge-info">виджетов: {{ d.widgets }}</span></p>
    </article>
  {% endfor %}
</div>
<form method="post" action="{{ url_for('dashboards.refresh') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-primary" type="submit">Обновить данные</button>
</form>
{% endblock %}
